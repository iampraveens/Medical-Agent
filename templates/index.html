<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HealthCare AI - Medical Assistant</title>
    <link rel="icon" type="image/png" href="https://img.icons8.com/color/48/medical-doctor.png">
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
</head>
<body>
    <!-- Chatbot Container -->
    <div class="chatbot">
        <header>
            <h2>Medical AI Assistant</h2>
        </header>
        <ul class="chatbox">
            <li class="chat incoming">
                <i class="fas fa-robot"></i>
                <div class="message-content">
                    <p>Welcome to HealthCare AI! 👋</p>
                    <p>Ask about symptoms, treatments, or medical advice.</p>
                    <p><strong>Note:</strong> This is not a substitute for professional medical advice.</p>
                </div>
            </li>
        </ul>
        <div class="chat-input">
            <textarea placeholder="Type your health question (e.g., What causes migraines?)" spellcheck="false" required aria-label="Message Input"></textarea>
            <button id="send-btn" aria-label="Send Message"><i class="fas fa-paper-plane"></i></button>
        </div>
    </div>

    <script>
        const chatbox = document.querySelector(".chatbox");
        const chatInput = document.querySelector(".chat-input textarea");
        const sendChatBtn = document.querySelector("#send-btn");

        let userMessage = null;
        const inputInitHeight = chatInput.scrollHeight;

        const parseMessage = (message) => {
            // Convert markdown-like formatting to HTML
            let formatted = message
                .replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>') // Bold
                .replace(/\* (.*?)(?=\n|$)/g, '<li>$1</li>'); // Bullets to list items
            
            if (formatted.includes('<li>')) {
                formatted = formatted.replace(/(<li>.*?(?:<\/li>)+)/gs, '<ul>$1</ul>');
                return formatted;
            } else {
                return `<p>${formatted}</p>`;
            }
        }

        const typeWriter = (element, htmlString) => {
            let i = 0;
            let isTag = false;
            let text = '';

            const type = () => {
                text = htmlString.slice(0, ++i);
                if (text === htmlString) {
                    element.innerHTML = text;
                    chatbox.scrollTo(0, chatbox.scrollHeight);
                    return;
                }

                element.innerHTML = text;

                const char = text.slice(-1);
                if (char === '<') isTag = true;
                if (char === '>') isTag = false;

                if (isTag) {
                    type();
                } else {
                    setTimeout(type, 0.3); // Adjust typing speed here (milliseconds per character)
                }
                chatbox.scrollTo(0, chatbox.scrollHeight);
            };

            type();
        }

        const createChatLi = (message, className, isLoading = false) => {
            const chatLi = document.createElement("li");
            chatLi.classList.add("chat", className);
            let chatContent = className === "outgoing" 
                ? `<div class="message-content">${parseMessage(message)}</div>` 
                : `<i class="fas fa-robot"></i><div class="message-content"></div>`;
            if (isLoading) {
                chatContent = `<i class="fas fa-robot"></i><div class="message-content"><div class="typing-indicator"><span class="typing-dot"></span><span class="typing-dot"></span><span class="typing-dot"></span></div></div>`;
            }
            chatLi.innerHTML = chatContent;
            return chatLi;
        }

        const generateResponse = (chatElement) => {
            const messageContent = chatElement.querySelector(".message-content");

            fetch('/get_response', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                },
                body: JSON.stringify({
                    message: userMessage
                })
            })
            .then(response => response.json())
            .then(data => {
                // Remove typing indicator
                const typingIndicator = messageContent.querySelector(".typing-indicator");
                if (typingIndicator) {
                    typingIndicator.remove();
                }
                // Start typing the response
                const formatted = parseMessage(data.response);
                typeWriter(messageContent, formatted);
            })
            .catch(() => {
                // Remove typing indicator
                const typingIndicator = messageContent.querySelector(".typing-indicator");
                if (typingIndicator) {
                    typingIndicator.remove();
                }
                messageContent.innerHTML = `<p class="error">Sorry, I couldn't process your request. Please try again.</p>`;
                chatbox.scrollTo(0, chatbox.scrollHeight);
            });
        }

        const handleChat = () => {
            userMessage = chatInput.value.trim();
            if (!userMessage) return;

            chatInput.value = "";
            chatInput.style.height = `${inputInitHeight}px`;

            chatbox.appendChild(createChatLi(userMessage, "outgoing"));
            chatbox.scrollTo(0, chatbox.scrollHeight);

            setTimeout(() => {
                const incomingChatLi = createChatLi(null, "incoming", true);
                chatbox.appendChild(incomingChatLi);
                chatbox.scrollTo(0, chatbox.scrollHeight);
                generateResponse(incomingChatLi);
            }, 600);
        }

        chatInput.addEventListener("input", () => {
            chatInput.style.height = `${inputInitHeight}px`;
            chatInput.style.height = `${chatInput.scrollHeight}px`;
        });

        chatInput.addEventListener("keydown", (e) => {
            if (e.key === "Enter" && !e.shiftKey) {
                e.preventDefault();
                handleChat();
            }
        });

        sendChatBtn.addEventListener("click", handleChat);
    </script>
</body>
</html>
